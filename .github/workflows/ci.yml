name: Reflex CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Syntax check
      run: python -m py_compile reflex.py burp_parser.py dom_xss_sim.py
    - name: CLI smoke test
      run: python reflex.py --help
